<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Accessibility Test</title>
  </head>
  <body>
    <h1>My Image Gallery</h1>

    <h2>Image 1 - Nature</h2>
    <img src="images/nature.jpg" alt="Green mountains surrounded by trees" width="400" />

    <h2>Image 2 - Gaming</h2>
    <img src="images/terraria.jpg" alt="Terraria game landscape with trees and mountains" width="400" />

    <h2>Image 3 - Missing Image</h2>
    <img src="missing_photo.jpg" alt="A beautiful sunset over the ocean" width="400" />
  </body>
</html>

<!--When an image fails to load, the browser usually displays a broken image icon or the alternative text instead of the image. 
    The alt attribute helps users understand what the missing image was supposed to show. -->
