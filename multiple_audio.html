<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multi-Format Audio</title>
  </head>
  <body>
    <!--
    Providing multiple audio formats improves cross-browser
    compatibility because different browsers may support
    different audio file formats.
    -->
    <audio controls>
      <source src="audio/The_Weeknd.mp3" type="audio/mp3" />
      <source src="audio/The_Weeknd.ogg" type="audio/ogg" />
    </audio>
  </body>
</html>
